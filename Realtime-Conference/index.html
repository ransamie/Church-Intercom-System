<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Church Intercom - Realtime Conference</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #007bff;
            --background-color: #12131a;
            --card-bg: rgba(26, 28, 40, 0.95);
            --text-color: #ffffff;
            --text-muted: #9aa0a6;
            --border-color: rgba(255, 255, 255, 0.1);
            --danger-color: #ff4444;
            --success-color: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- LOGIN SCREEN --- */
        #loginScreen {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(12px);
        }

        .app-logo-img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            object-fit: cover;
        }

        h1 { font-size: 1.6rem; margin-bottom: 5px; font-weight: 700; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }

        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .preset-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 5px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .preset-btn:hover { background: var(--primary-color); color: white; }

        .unlock-btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        /* --- CONFERENCE SCREEN --- */
        #conferenceScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
        }

        .status-header {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .station-badge {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wake-badge {
            font-size: 0.75rem;
            color: var(--success-color);
            background: rgba(46,204,113,0.1);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(46,204,113,0.3);
        }

        .peer-roster-title {
            align-self: flex-start;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .peer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
            margin-bottom: 30px;
        }

        .peer-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .peer-card.speaking {
            border-color: var(--success-color);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
            background: rgba(46, 204, 113, 0.08);
        }

        .mute-control-btn {
            width: 100%;
            padding: 18px;
            border-radius: 40px;
            border: none;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .mute-control-btn.muted {
            background: var(--danger-color);
            box-shadow: 0 8px 25px rgba(255, 68, 68, 0.4);
        }

        .mute-control-btn.live {
            background: var(--success-color);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .icon-svg { width: 22px; height: 22px; fill: currentColor; }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        .footer a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <img src="logo.jpg" alt="Logo" class="app-logo-img" />
        <h1 id="appTitle">Church Intercom</h1>
        <p class="subtitle" id="appDesc">Realtime Conference Mode</p>
        
        <div class="form-group">
            <label>1. Select Your Station:</label>
            <input type="text" id="stationInput" placeholder="e.g. Cam 1, Sound Desk" />
            <div class="preset-grid">
                <button className="preset-btn" onclick="setPreset('Cam 1')">Cam 1</button>
                <button className="preset-btn" onclick="setPreset('Cam 2')">Cam 2</button>
                <button className="preset-btn" onclick="setPreset('Sound Desk')">Sound</button>
                <button className="preset-btn" onclick="setPreset('Director')">Director</button>
                <button className="preset-btn" onclick="setPreset('Visuals')">Visuals</button>
                <button className="preset-btn" onclick="setPreset('Usher 1')">Usher</button>
            </div>
        </div>

        <div class="form-group">
            <label>2. Enter Team Password:</label>
            <input type="password" id="passwordInput" placeholder="••••••••" />
        </div>

        <button class="unlock-btn" onclick="attemptLogin()">JOIN CONFERENCE</button>

        <div class="footer">
            Developed by <a href="https://github.com/ransamie" target="_blank">Ransamie Technologies (RanTech)</a>
        </div>
    </div>

    <!-- CONFERENCE SCREEN -->
    <div id="conferenceScreen">
        <div class="status-header">
            <div class="station-badge">
                <svg class="icon-svg" style="color:var(--primary-color)" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                <span id="currentStationName">Cam 1</span>
            </div>
            <div class="wake-badge">
                Screen Active
            </div>
        </div>

        <div class="peer-roster-title">CONNECTED STATIONS</div>
        <div id="peerGrid" class="peer-grid">
            <!-- Dynamic station cards will be inserted here -->
        </div>

        <button id="muteBtn" class="mute-control-btn muted" onclick="toggleMute()">
            <svg id="muteIcon" class="icon-svg" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.27-1.48.42-2.31.42-3.31 0-6-2.69-6-6H4c0 4.02 3.01 7.34 6.86 7.82V21h2.28v-3.18c.84-.11 1.64-.37 2.37-.75l3.22 3.22L20 19.01 4.27 3z"/></svg>
            <span id="muteText">MIC IS MUTED (Tap to Talk)</span>
        </button>

        <div class="footer">
            Built by <a href="https://github.com/ransamie" target="_blank">Ransamie Technologies (RanTech)</a>
        </div>
    </div>

    <!-- SILENT AUDIO LOOP TO PREVENT BACKGROUND SLEEP -->
    <audio id="silentAudio" loop playsinline src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>
    <div id="audioContainer" style="display:none;"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let localStream = null;
        let peerConnections = {};
        let isMuted = true;
        let myStationName = 'Cam 1';

        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        document.getElementById('stationInput').value = localStorage.getItem('stationName') || 'Cam 1';

        function setPreset(name) {
            document.getElementById('stationInput').value = name;
        }

        // Screen Wake Lock API
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
                document.getElementById('silentAudio').play().catch(() => {});
            } catch (err) {}
        }

        function attemptLogin() {
            const pass = document.getElementById('passwordInput').value;
            myStationName = document.getElementById('stationInput').value.trim() || 'Station Device';
            localStorage.setItem('stationName', myStationName);

            socket.emit('login', { password: pass, stationName: myStationName });
        }

        socket.on('login-success', (data) => {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('conferenceScreen').style.display = 'flex';
            document.getElementById('currentStationName').innerText = data.stationName;

            requestWakeLock();
            startLocalAudio();
        });

        socket.on('auth-error', (msg) => alert(msg));
        socket.on('room-full', () => alert('Conference Room is Full!'));

        socket.on('roster-update', (roster) => {
            const grid = document.getElementById('peerGrid');
            grid.innerHTML = '';

            roster.forEach(u => {
                const card = document.createElement('div');
                card.className = `peer-card ${u.isSpeaking ? 'speaking' : ''}`;
                card.id = `peer-${u.id}`;
                card.innerText = u.stationName;
                grid.appendChild(card);
            });
        });

        function startLocalAudio() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    localStream = stream;
                    localStream.getAudioTracks()[0].enabled = false; // Start muted
                })
                .catch(err => alert("Microphone Permission Required!"));
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;

            const btn = document.getElementById('muteBtn');
            const text = document.getElementById('muteText');

            if (isMuted) {
                btn.className = 'mute-control-btn muted';
                text.innerText = 'MIC IS MUTED (Tap to Talk)';
                socket.emit('speaking-state', false);
            } else {
                btn.className = 'mute-control-btn live';
                text.innerText = 'MIC IS LIVE (Tap to Mute)';
                socket.emit('speaking-state', true);
            }
        }
    </script>
</body>
</html>
