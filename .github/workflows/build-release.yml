name: Build Cross-Platform Desktop Installers & Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Installer for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fuse

      - name: Install Launcher Dependencies
        run: |
          cd launcher
          npm install

      - name: Build Release Binaries
        working-directory: ./launcher
        run: |
          npx electron-builder --publish never

      - name: Upload Binaries to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            launcher/dist-installer/*.exe
            launcher/dist-installer/*.dmg
            launcher/dist-installer/*.AppImage
            launcher/dist-installer/*.blockmap
            launcher/dist-installer/latest*.yml
          retention-days: 1

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        working-directory: ./mobile-app
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./mobile-app/android
        run: |
          bash ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/church-intercom-android.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: mobile-app/android/app/build/outputs/apk/debug/church-intercom-android.apk
          retention-days: 1

  publish:
    name: Publish Release
    needs: [release, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
