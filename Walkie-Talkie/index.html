<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Intercom</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a1a1a" id="metaThemeColor">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #0056b3;
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --success-color: #2ecc71;
            --danger-color: #ff4444;
        }
        /* DARK THEME & LAYOUT */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: var(--bg-color); 
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- LOGIN SCREEN (Overlay) --- */
        #loginScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #loginScreen h1 { color: var(--primary-color); margin-bottom: 5px; font-size: 2rem; }
        #loginScreen p { color: #666; margin-top: 0; margin-bottom: 30px; }

        input[type="password"] {
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #222;
            color: white;
            text-align: center;
            width: 70%;
            max-width: 300px;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s;
        }
        input[type="password"]:focus { border-color: #007bff; }

        .unlock-btn {
            background: var(--primary-color); color: white; border: none;
            padding: 15px 40px; font-size: 18px; font-weight: bold;
            border-radius: 50px; cursor: pointer;
        }

        .error-msg { color: var(--danger-color); margin-bottom: 15px; display: none; }

        /* --- MAIN APP (Hidden initially) --- */
        #appContainer {
            display: none; /* Hidden until unlocked */
            flex-grow: 1;
            flex-direction: column;
            padding: 20px;
        }

        h2 { margin-top: 0; color: #ccc; }
        #status { font-weight: bold; color: #ff4444; margin-bottom: 20px; }

        /* Centered Talk Button */
        .btn-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #talkBtn {
            padding: 0;
            font-size: 22px;
            font-weight: bold;
            background-color: var(--primary-color);
            color: white;
            border: 5px solid var(--secondary-color);
            border-radius: 50%;
            width: 240px;
            height: 240px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 123, 255, 0.4);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Crucial for mobile */
            transition: transform 0.1s;
        }
        
        #talkBtn.active {
            background-color: #d32f2f;
            border-color: #b71c1c;
            transform: scale(0.95);
            box-shadow: 0 0 40px rgba(211, 47, 47, 0.6);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(211, 47, 47, 0); }
            100% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
        }

        /* --- FOOTER --- */
        .footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.85rem;
            color: #555;
            border-top: 1px solid #222;
        }
        .footer a { color: var(--primary-color); text-decoration: none; font-weight: bold; }
        
        #installBtn {
            display: none;
            margin-top: 15px;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <img src="logo.jpg" alt="App Logo" style="width: 75px; height: 75px; border-radius: 16px; margin-bottom: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.4);" />
        <h1 id="appTitle">Church Intercom</h1>
        <p id="appDesc">Secure Audio Relay System</p>
        
        <div id="loginError" class="error-msg">Incorrect Password</div>
        
        <input type="password" id="passInput" placeholder="Enter Team Password">
        <button class="unlock-btn" onclick="attemptLogin()">UNLOCK SYSTEM</button>

        <div class="footer">
            Developed by <a href="https://github.com/ransamie" target="_blank">Ransamie Technologies (RanTech)</a>
            <br><button id="installBtn">⬇️ Install App</button>
        </div>
    </div>

    <div id="appContainer">
        <h2>WiFi Walkie-Talkie</h2>
        <div id="status">Connecting...</div>
        
        <div class="btn-wrapper">
            <button id="talkBtn">HOLD TO TALK</button>
        </div>

        <div class="footer">
            Developed by <a href="https://github.com/ransamie" target="_blank">Ransamie Technologies (RanTech)</a>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // PWA Setup
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(console.error);
        }
        
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        // Config Loading
        fetch('/config').then(r => r.json()).then(config => {
            document.title = config.appName;
            document.getElementById('appTitle').innerText = config.appName;
            if(config.appDescription) document.getElementById('appDesc').innerText = config.appDescription;
            
            const root = document.documentElement;
            if(config.theme) {
                if(config.theme.primaryColor) root.style.setProperty('--primary-color', config.theme.primaryColor);
                if(config.theme.secondaryColor) root.style.setProperty('--secondary-color', config.theme.secondaryColor);
                if(config.theme.backgroundColor) {
                    root.style.setProperty('--bg-color', config.theme.backgroundColor);
                    document.getElementById('metaThemeColor').content = config.theme.backgroundColor;
                }
                if(config.theme.textColor) root.style.setProperty('--text-color', config.theme.textColor);
                if(config.theme.successColor) root.style.setProperty('--success-color', config.theme.successColor);
                if(config.theme.dangerColor) root.style.setProperty('--danger-color', config.theme.dangerColor);
            }
        }).catch(console.error);

        const socket = io();
        
        // UI Elements
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const passInput = document.getElementById('passInput');
        const loginError = document.getElementById('loginError');
        const btn = document.getElementById('talkBtn');
        const statusText = document.getElementById('status');

        // Audio Vars
        let mediaRecorder;
        let audioChunks = [];

        // --- AUTHENTICATION ---
        function attemptLogin() {
            const password = passInput.value;
            if(password) socket.emit('login', password);
        }

        passInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") attemptLogin();
        });

        socket.on('auth-error', (msg) => {
            loginError.style.display = 'block';
            loginError.innerText = "❌ " + msg;
            passInput.value = "";
        });

        socket.on('login-success', () => {
            loginScreen.style.display = 'none';
            appContainer.style.display = 'flex';
            initializeAudio(); // Only ask for mic AFTER login
        });

        // --- WALKIE TALKIE LOGIC ---
        function initializeAudio() {
            navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                statusText.innerText = "Status: Online & Ready";
                statusText.style.color = "#2ecc71";

                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.addEventListener("dataavailable", event => {
                    audioChunks.push(event.data);
                });

                mediaRecorder.addEventListener("stop", () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    socket.emit('voice', audioBlob);
                    audioChunks = [];
                });
            })
            .catch(err => {
                statusText.innerText = "Microphone Error: " + err.message;
            });
        }

        // Button Interactions
        const startRecording = (e) => {
            e.preventDefault(); 
            if (mediaRecorder && mediaRecorder.state === "inactive") {
                mediaRecorder.start();
                btn.classList.add('active');
                btn.innerText = "TRANSMITTING...";
            }
        };

        const stopRecording = (e) => {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.classList.remove('active');
                btn.innerText = "HOLD TO TALK";
            }
        };

        btn.addEventListener('mousedown', startRecording);
        btn.addEventListener('mouseup', stopRecording);
        btn.addEventListener('touchstart', startRecording);
        btn.addEventListener('touchend', stopRecording);

        // Receive Audio
        socket.on('voice', (arrayBuffer) => {
            const blob = new Blob([arrayBuffer], { 'type' : 'audio/ogg; codecs=opus' });
            const audioUrl = URL.createObjectURL(blob);
            const audio = new Audio(audioUrl);
            audio.play().catch(e => console.log("Playback error:", e));
        });

    </script>
</body>
</html>
